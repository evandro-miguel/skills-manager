name: Release Publish

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish package to npm using trusted publishing
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Check npm publication eligibility
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_npm == 'true' }}
        run: |
          bun -e 'const p = require("./package.json"); if (p.private) { console.error("npm publication is disabled: package.json keeps private=true."); process.exit(1); }'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate publish gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run validate:publish

      - name: Guard repository visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/commands/skill-sys.ts guard-repo-visibility --repository "$GITHUB_REPOSITORY"

      - name: Prepare release smoke artifacts
        run: bun scripts/commands/release-smoke.ts --json

  publish-npm:
    name: Publish npm package with provenance
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_npm == 'true' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/

      - name: Check npm publication eligibility
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_npm == 'true' }}
        run: |
          bun -e 'const p = require("./package.json"); if (p.private) { console.error("npm publication is disabled: package.json keeps private=true."); process.exit(1); }'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Re-run publish gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run validate:publish

      - name: Publish with npm provenance
        run: npm publish --provenance --tag next
