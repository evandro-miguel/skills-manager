name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '41 3 * * 2'
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Private repository compatibility guard
        if: ${{ github.event.repository.private }}
        run: |
          echo "OpenSSF Scorecard action is skipped for private repositories because its GitHub GraphQL checks are not accessible to GITHUB_TOKEN here."
          echo "The public-release path keeps the official Scorecard action enabled when the repository is no longer private."

      - name: Run Scorecard
        if: ${{ !github.event.repository.private }}
        uses: ossf/scorecard-action@ff5dd8929f96a8a4dc67d13f32b8c75057829621
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload SARIF
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@b0c4fd77f6c559021d78430ec4d0d169ae74a4eb
        with:
          sarif_file: scorecard-results.sarif
